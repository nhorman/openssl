name: "Run openssl quic interop testing on pull request"

on:
  pull_request:

permissions: {}

jobs:
  test_quic_interop:
    if: contains(github.event.pull_request.labels.*.name, 'quic-interop-tests')
    runs-on: ubuntu-latest
    steps:
      - name: "Dump github payload"
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: echo "$EVENT_JSON"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: "Build openssl container"
        run: |
          cd test/quic-openssl-docker/
          echo "Building ${{ github.event.base.repo.clone_url }} branch ${{ github.event.head.ref }}"
          docker build -t quay.io/openssl-ci/openssl-quic-interop:latest --build-arg OPENSSL_URL=${{ github.event.base.repo.clone_url }} --build-arg OPENSSL_BRANCH=${{ github.event.head.ref }} .

